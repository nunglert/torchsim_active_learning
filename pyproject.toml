# -*- coding: utf-8 -*-

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "torchsim_AL"
authors = [
    { name = "Bruno Bachmair", email = "e11705357@tuwien.ac.at" }
]
description = "Package for a Replica Exchange Sampler in the remote_handler active learning framework"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Natural Language :: English"
]
dependencies = [
    "remote_handler @ git+ssh://git@gitlab.tuwien.ac.at/e165-03-1_theoretische_materialchemie/madsen-s-research-group/remote_handler.git@dev-NU",
    "ase",
    "torch-sim-atomistic==0.6.0",
    "mace-torch==0.3.16",
]
readme = "README.md"
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "pytest==7.4.0",
    "pre-commit"
]
docs = [
    "sphinx>=7.0",
    "sphinx-autodoc-typehints",
    "sphinx-rtd-theme",
]

[tool.setuptools.packages.find]
where = ["src"]
